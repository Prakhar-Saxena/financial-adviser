[project]
name = "fin"
version = "0.1.0"
description = "Local expense tracker (Financial Adviser MVP)"
authors = [{ name = "Prakhar Saxena" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE", "COPYRIGHT"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.142.2",
    "jsonschema>=4.26.0",
    "lxml>=6.1.3",
    "pdfplumber>=0.11.10",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
fin = "fin.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"src/fin/db/migrations/versions/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
