#
# Seed merchant profiles (docs/SPEC-cards.md §4, §8). Loaded into merchant_profiles on every run
# (source "seed"); a profile I've corrected (source "user") is never overwritten.
#
# category: how the card network codes the merchant (config/reward_categories.json), not what is
#           bought. Costco is a wholesale club; Target and Walmart are discount stores/superstores.
# mcc:      a typical merchant category code, as a hint only.
# accepts:  network acceptance, only where it's well established (else "unknown"). Sources go in
#           docs/decisions.md.
# aliases:  extra names; the key and the name are aliases already. Matching is on normalized text
#           (lower case, "&" -> "and", punctuation dropped).
version: 1
merchants:
  # --- SPEC §10 merchant groups (keys must stay equal to the group names) ---
  - {key: amazon, name: Amazon.com, category: other, mcc: "5942",
     aliases: [amazon, amazon com, amzn, amazon prime, prime video, kindle, audible]}
  - {key: whole_foods, name: Whole Foods Market, category: supermarkets, mcc: "5411",
     aliases: [whole foods, whole foods market, wholefds]}
  - {key: costco_warehouse, name: Costco warehouse, category: wholesale_clubs, mcc: "5300",
     accepts: {visa: "yes", amex: "no", mastercard: "no", discover: "no"},
     aliases: [costco, costco warehouse, costco whse, costco wholesale]}
  - {key: costco_gas, name: Costco gas, category: gas_stations, mcc: "5542",
     accepts: {visa: "yes", amex: "no", mastercard: "no", discover: "no"},
     aliases: [costco gas, costco gas station, costco fuel]}
  - {key: costco_online, name: Costco.com, category: wholesale_clubs, mcc: "5300",
     accepts: {visa: "yes"}, aliases: [costco com, costco online, costco.com]}
  - {key: amazon_fresh, name: Amazon Fresh, category: supermarkets, mcc: "5411",
     notes: "Amazon Fresh stores code as groceries; Fresh delivery through amazon.com may code as Amazon.",
     aliases: [amazon fresh]}

